Params:
  io:
    data_path: 'example_data_for_uiPSF/bead_data_substack'
    keyword: ""
    output_path: 'test_output'
    subfolder: ""
    format: .tif
    variable_name: ""
    filelist: []

  data:
    camera_gain: 0.2
    camera_offset: 100
    stage_movement_direction: normal
    swap_xy_dimensions: false
    emission_wavelength: 0.5
    numerical_aperture: 1.2
    refractive_indices:
      immersion: 1.33
      medium: 1.335
      coverslip: 1.33
    pixel_size:
      x: 0.086
      y: 0.086
      z: 0.5
    lattice_light_sheet:
      skew_translation_per_slice: [0,0]

  selection:
    roi:
      roi_size: [50,50]
      gauss_sigma: [2,2]
      max_kernel: [3,3]
      peak_height: 0.2
      max_bead_number: 30
      bead_radius: 0.1
    FOV:
      y_center: 0
      x_center: 0
      radius: 0
      z_start: 0
      z_end: -0
      z_step: 1

  model:
    psf_type: zernike
    psf:
      pupil_size: 64
      max_zernike_order: 8
      extra_blur_sigma: 0.1
      include_apodization: true
      constant_pupil_magnitude: false
      radially_symmetric_magnitude: false
      include_index_mismatch: false
      initial_pupil_file_path: ""
      estimate_drift: false
      estimate_photon_variation: false
      pixel_upsampling_factor: 1
    loss_weight:
      mse_weight: 1
      modified_mse_weight: 1
      smooth: 0
      edge: 0.01
      psf_positivity_weight: 1
      background_positivity_weight: 1
      photon_positivity_weight: 1
      intensity_normalization_weight: 0
      lateral_drift_weight: 10
    rej_threshold:
      bias_z: 0.99
      mse: 0.8
      photon: 1.5

  runtime:
    use_cuda: true
    batch_size: 1600
    max_iterations: 200
    enable_relearning: true
    enable_localization: false
    plot_all_steps: false
